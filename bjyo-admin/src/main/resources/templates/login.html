<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录BJYO系统</title>
    <meta name="description" content="BJYO后台管理框架">
    <link href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link href="../static/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link href="../static/css/style.min.css" th:href="@{/css/style.min.css}" rel="stylesheet"/>
    <link href="../static/css/login.min.css" th:href="@{/css/login.min.css}" rel="stylesheet"/>
    <link href="../static/bjyo/css/bjyo-ui.css" th:href="@{/bjyo/css/bjyo-ui.css?v=4.8.3}" rel="stylesheet"/>
    <link href="../static/bjyo/css/bjyo-theme.css" th:href="@{/bjyo/css/bjyo-theme.css?v=20261008}" rel="stylesheet"/>
    <link href="../static/bjyo/css/bjyo-auth.css" th:href="@{/bjyo/css/bjyo-auth.css?v=20261008}" rel="stylesheet"/>
    <link href="../static/bjyo/css/bjyo-slider-captcha.css" th:href="@{/bjyo/css/bjyo-slider-captcha.css?v=20261011}" rel="stylesheet"/>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="../static/favicon.ico" th:href="@{favicon.ico}"/>
    <style type="text/css">label.error { position:inherit; }</style>
    <script>
        if(window.top!==window.self){alert('未登录或登录超时。请重新登录');window.top.location=window.location};
    </script>
</head>
<body class="signin">
    <main class="bjyo-auth-shell">
        <section class="bjyo-auth-panel">
            <div class="bjyo-auth-grid">
                <div class="bjyo-auth-brand">
                    <div class="bjyo-auth-mark"><span class="bjyo-brand-mark" aria-hidden="true">B</span><span>BJYO<small>ADMIN WORKSPACE</small></span></div>
                    <div class="bjyo-eyebrow">YOUR WORK, CONNECTED</div>
                    <h1>让管理更有序，<br>让工作更轻松。</h1>
                    <p>从团队协作到日常运营，一个清晰的工作空间，连接每一项重要工作。</p>
                    <div class="bjyo-auth-visual" aria-hidden="true">
                        <div class="bjyo-auth-visual-heading"><i class="fa fa-th-large"></i> 一站式管理工作台<span class="bjyo-visual-dot"></span></div>
                        <div class="bjyo-auth-visual-row"><span class="bjyo-icon"><i class="fa fa-users"></i></span><div><strong>团队与权限</strong><small>连接成员，明确每一份职责</small></div><i class="fa fa-angle-right"></i></div>
                        <div class="bjyo-auth-visual-row"><span class="bjyo-icon teal"><i class="fa fa-sliders"></i></span><div><strong>业务与配置</strong><small>集中管理，让日常操作更简单</small></div><i class="fa fa-angle-right"></i></div>
                        <div class="bjyo-auth-visual-row"><span class="bjyo-icon violet"><i class="fa fa-line-chart"></i></span><div><strong>监控与审计</strong><small>每一次操作，都有迹可循</small></div><i class="fa fa-angle-right"></i></div>
                    </div>
                    <ul class="bjyo-auth-points"><li><i class="fa fa-check-circle-o"></i> 清晰的权限管理</li><li><i class="fa fa-check-circle-o"></i> 高效的业务协作</li></ul>
                    <div class="bjyo-auth-footer">BJYO · 为高效管理而设计</div>
                </div>

                <div class="bjyo-auth-card">
                    <form id="signupForm" autocomplete="off">
                        <div class="bjyo-eyebrow">WELCOME BACK</div>
                        <h2>欢迎回来</h2>
                        <p class="auth-subtitle">登录账号，开始今天的工作。</p>
                        <div class="bjyo-auth-field"><label for="auth-username">用户名</label><input type="text" id="auth-username" name="username" autocomplete="username" class="form-control uname" placeholder="用户名"/></div>
                        <div class="bjyo-auth-field"><label for="auth-password">密码</label><input type="password" id="auth-password" name="password" autocomplete="current-password" class="form-control pword" placeholder="密码"/></div>
                        <div id="slider-captcha" class="slider-captcha" th:if="${captchaEnabled==true}">
                            <button type="button" id="slider-captcha-trigger" class="slider-captcha-trigger" aria-haspopup="dialog" aria-expanded="false">
                                <span id="slider-trigger-icon" aria-hidden="true">◇</span>
                                <span id="slider-trigger-label">点击进行安全验证</span>
                                <span aria-hidden="true">›</span>
                            </button>
                            <span id="slider-trigger-status" class="slider-status" role="status" aria-live="polite"></span>
                        </div>
                        <div class="checkbox-custom" th:if="${isRemembered}" th:classappend="${captchaEnabled==false} ? 'm-t'">
                            <input type="checkbox" id="rememberme" name="rememberme"> <label for="rememberme">保持登录</label>
                        </div>
                        <button class="btn btn-success btn-block" id="btnSubmit" data-loading="正在验证登录，请稍候...">登 录 <i class="fa fa-arrow-right" aria-hidden="true"></i></button>
                        <div class="bjyo-auth-alt" th:if="${isAllowRegister}">
                            <span>还没有账号？</span>
                            <a th:href="@{/register}">立即注册</a>
                        </div>
                        <div class="bjyo-auth-note"><i class="fa fa-shield" aria-hidden="true"></i> 账号访问由系统统一管理</div>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <dialog id="slider-captcha-dialog" class="slider-captcha-dialog" aria-labelledby="slider-dialog-title" aria-describedby="slider-dialog-description" th:if="${captchaEnabled==true}">
        <div class="slider-captcha-header">
            <div><strong id="slider-dialog-title">安全验证</strong><span id="slider-dialog-description">拖动滑块完成拼图</span></div>
            <button type="button" id="slider-captcha-close" class="slider-captcha-close" aria-label="关闭安全验证">×</button>
        </div>
        <div class="slider-captcha-panel">
            <div class="slider-captcha-image">
                <img id="slider-background" class="slider-background" alt="拼图背景" hidden/>
                <img id="slider-piece" class="slider-piece" alt="拼图片块" hidden/>
                <div id="slider-captcha-loading" class="slider-captcha-loading" role="status">验证码加载中…</div>
            </div>
            <div id="slider-track" class="slider-track">
                <div id="slider-progress" class="slider-progress"></div>
                <span id="slider-tip" class="slider-tip">按住滑块，拖动完成拼图</span>
                <button type="button" id="slider-handle" class="slider-handle" role="slider" aria-label="拖动滑块" aria-valuemin="0" aria-valuemax="268" aria-valuenow="0" disabled>»</button>
            </div>
            <div class="slider-actions">
                <span id="slider-status" class="slider-status" role="status" aria-live="polite"></span>
                <button type="button" id="slider-refresh" class="slider-refresh">刷新</button>
            </div>
        </div>
    </dialog>
<script th:inline="javascript"> var ctx = [[@{/}]]; var captchaType = [[${captchaType}]]; var captchaEnabled = [[${captchaEnabled}]];</script>
<!--[if lte IE 8]><script>window.location.href=ctx+'html/ie.html';</script><![endif]-->
<script src="../static/js/jquery.min.js" th:src="@{/js/jquery.min.js}"></script>
<script src="../static/ajax/libs/validate/jquery.validate.min.js" th:src="@{/ajax/libs/validate/jquery.validate.min.js}"></script>
<script src="../static/ajax/libs/layer/layer.min.js" th:src="@{/ajax/libs/layer/layer.min.js}"></script>
<script src="../static/ajax/libs/blockUI/jquery.blockUI.js" th:src="@{/ajax/libs/blockUI/jquery.blockUI.js}"></script>
<script src="../static/bjyo/js/bjyo-ui.js" th:src="@{/bjyo/js/bjyo-ui.js?v=4.8.3}"></script>
<script src="../static/bjyo/js/bjyo-slider-captcha.js" th:src="@{/bjyo/js/bjyo-slider-captcha.js?v=20261011}"></script>
<script src="../static/bjyo/login.js" th:src="@{/bjyo/login.js?v=20261011}"></script>
</body>
</html>
